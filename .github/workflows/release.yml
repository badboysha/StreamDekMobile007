name: Build Optimized ARM64 Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-24.04

    env:
      JAVA_VERSION: "17"

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Java
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # Gradle
      # --------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # --------------------------------------------------
      # Build Release APK
      # --------------------------------------------------
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # Find APK
      # --------------------------------------------------
      - name: Find APK
        id: find_apk
        shell: bash
        run: |
          APK=$(find . -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found."
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Android SDK / Build Tools
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # Locate build tools
      # --------------------------------------------------
      - name: Prepare APK tools
        shell: bash
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$BUILD_TOOLS"

      # --------------------------------------------------
      # Optimize ARM64 APK
      # --------------------------------------------------
      - name: Optimize APK for ARM64
        shell: bash
        run: |
          mkdir -p optimized

          cp "${{ steps.find_apk.outputs.apk }}" optimized/app-unsigned.apk

          cd optimized

          mkdir extracted
          cd extracted

          unzip -q ../app-unsigned.apk

          # Remove native libraries for non-ARM64 ABIs
          rm -rf lib/armeabi-v7a 2>/dev/null || true
          rm -rf lib/x86 2>/dev/null || true
          rm -rf lib/x86_64 2>/dev/null || true
          rm -rf lib/mips 2>/dev/null || true
          rm -rf lib/mips64 2>/dev/null || true

          # Repack APK
          zip -qr ../app-arm64-unsigned.apk .

          cd ..

          echo "ARM64 optimization completed."

      # --------------------------------------------------
      # Generate temporary signing key
      # --------------------------------------------------
      - name: Generate signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Release,O=Android,C=US"

      # --------------------------------------------------
      # Align APK
      # --------------------------------------------------
      - name: Zipalign APK
        shell: bash
        run: |
          "$BUILD_TOOLS/zipalign" \
            -f \
            -p 4 \
            optimized/app-arm64-unsigned.apk \
            optimized/app-arm64-aligned.apk

      # --------------------------------------------------
      # Sign APK
      # --------------------------------------------------
      - name: Sign APK
        shell: bash
        run: |
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias release \
            --out optimized/app-arm64-release.apk \
            optimized/app-arm64-aligned.apk

      # --------------------------------------------------
      # Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          "$BUILD_TOOLS/apksigner" verify --verbose \
            optimized/app-arm64-release.apk

          echo ""
          echo "========== APK INFO =========="
          ls -lh optimized/app-arm64-release.apk

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ARM64-Release-APK
          path: optimized/app-arm64-release.apk
          if-no-files-found: error
          retention-days: 30
